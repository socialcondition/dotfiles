# ==========================================
# FOOT TERMINAL LOOK & FEEL FOR KITTY
# ==========================================

# --- Font Configuration ---
# Foot defaults to system monospace at size 8
font_family      monospace
bold_family      auto
italic_family    auto
bold_italic_family auto
font_size        11.0

# --- Window Layout & Padding ---
# Foot has a default padding of 2x2 pixels
window_padding_width 2
hide_window_decorations no
remember_window_size  no
initial_width        80c
initial_height       24c

# --- Cursor Customization ---
# Foot defaults to a non-blinking block cursor
cursor_shape          block

# --- Scrollback ---
scrollback_lines 10000

# --- Foot Default Color Palette ---
# Main background and text
background #111111
foreground #dcdccc

# Selection colors
selection_background #dcdccc
selection_foreground #111111

# The 16 ANSI colors
# Regular colors (0-7)
color0 #111111
color1 #cc9393
color2 #7f9f7f
color3 #f0dfaf
color4 #8cd0d3
color5 #dc8cc3
color6 #93e0e3
color7 #dcdccc

# Bright colors (8-15)
color8  #4d4d4d
color9  #dca3a3
color10 #bfebbf
color11 #f0dfaf
color12 #8cd0d3
color13 #dc8cc3
color14 #93e0e3
color15 #ffffff


